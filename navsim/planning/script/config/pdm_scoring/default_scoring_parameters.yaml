proposal_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  num_poses: 40
  interval_length: 0.1

simulator:
  _target_: navsim.planning.simulation.planner.pdm_planner.simulation.pdm_simulator.PDMSimulator
  _convert_: 'all'
  proposal_sampling: ${proposal_sampling}

scorer: 
  _target_: navsim.planning.simulation.planner.pdm_planner.scoring.pdm_scorer.PDMScorer
  _convert_: 'all'
  proposal_sampling: ${proposal_sampling}
  vehicle_parameters:
    _target_: navsim.planning.scenario_builder.mogo_vehicle_parameters.get_mogo_vehicle_parameters
  config: 
    _target_: navsim.planning.simulation.planner.pdm_planner.scoring.pdm_scorer.PDMScorerConfig
    _convert_: 'all'
    # weighted metric weights
    progress_weight: 5.0
    ttc_weight: 5.0
    comfortable_weight: 2.0
    driving_direction_weight: 0.0
    obstacle_clearance_weight: 2.0
    following_safety_weight: 2.0

    # thresholds
    driving_direction_horizon: 1.0  # [s] (driving direction)
    driving_direction_compliance_threshold: 2.0  # [m] (driving direction)
    driving_direction_violation_threshold: 6.0  # [m] (driving direction)
    stopped_speed_threshold: 5e-03  # [m/s] (ttc)
    at_fault_collision_score_floor: 0.05  # (no at-fault collision)
    traffic_light_violation_score: 0.05  # (traffic light compliance)
    traffic_light_yellow_duration: 3.0  # [s] (traffic light compliance)
    traffic_light_green_flash_duration: 3.0  # [s] (traffic light compliance)
    reverse_driving_score_floor: 0.05  # (no reverse driving)
    reverse_driving_min_delta: 0.01  # [m] (no reverse driving)
    ttc_horizon: 2.0  # [s] (ttc)
    ttc_full_weight_time: 1.0  # [s] (ttc)
    ttc_transition_center: 1.5  # [s] (ttc)
    ttc_transition_width: 0.35  # [s] (ttc)
    ttc_min_time_weight: 0.0  # (ttc)
    progress_distance_threshold: 5.0  # [m] (progress)
    following_safety_start_time: 0.5  # [s] (following safety)
    following_safety_horizon: 4.0  # [s] (following safety)
    following_safety_transition_center: 1.5  # [s] (following safety)
    following_safety_transition_width: 0.5  # [s] (following safety)
    following_base_gap: 1.0  # [m] (following safety)
    following_time_headway: 0.35  # [s] (following safety)
    following_closing_speed_gain: 0.25  # [s] (following safety)
    following_max_required_gap: 7.0  # [m] (following safety)
    following_lateral_margin: 0.8  # [m] (following safety)
    following_score_scale: 1.5  # [m] (following safety)
