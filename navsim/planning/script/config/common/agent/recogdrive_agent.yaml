_target_: navsim.agents.recogdrive.recogdrive_agent.ReCogDriveAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5
checkpoint_path: ''
vlm_path: ''
cam_type: 'single'
# --- 多视角 / 多帧时序输入（默认全关，等价当前单视角单帧 Qwen3 流程，零影响）---
# 视角数 = len(view_list)；多视角 / 多帧需在脚本里显式 override 开启，并保证缓存与
# 训练 / eval 用相同配置（否则 get_unique_name 对不上、CacheOnlyDataset 会报告缺失并过滤不完整样本）。
# mogo 多视角推荐用真实有数据的视角 ['cam_f0','cam_l0','cam_r0','cam_l1','cam_r1','cam_b0']，
# 避免选空的 cam_l2/cam_r2（否则 edge-pad 会用前视图冒充后侧视图）。
view_list: ['cam_f0']
num_frames: 1
use_video_input: false   # 仅 Qwen3 生效；True 且 num_frames>1 时走 videos= 视频路径
video_fps: 2.0
vlm_type: 'internvl'
dit_type: 'small'
sampling_method: 'ddim'
cache_mode: False
cache_hidden_state: True
metric_cache_path: ''
reference_policy_checkpoint: ''
vlm_size: 'small'
train_backbone: false
vl_hidden_dim: 1536
normalize_vl_hidden_states: false
# VLM 消融开关：none=正常使用 VLM；zero=置零 VLM 的 summary/context token，
# 仅消融 VLM 分支，obj token / ego status / history & action 等非 VLM 输入完整保留。
# 依赖性测试：加载已训练 ckpt，仅 eval 时 override agent.vlm_ablation=zero。
# 公平能力测试：IL 与 GRPO 全程同设 agent.vlm_ablation=zero（缓存可复用，无需重生成）。
vlm_ablation: none
# VLM 总开关（默认 true=加载并使用 VLM，与历史行为一致）。
# false: 完全不使用 VLM —— agent 不加载 Qwen3 backbone（在线 eval 也不前向），planner 不构造
#   vl_*_projector/gate/fusion_projector（模型更小），DiT 的 cross-attention context 仅由
#   obj/hdmap/img token 组成（三者都关则退化为纯 ego+action self-attention）。
# 与 vlm_ablation 区别：zero 仍加载 VLM 并投影后置零（不省参数/算力）；use_vlm=false 直接不构造、
#   不前向（更小更省，在线 eval 省一次 2B 前向）。缓存训练只读取
#   recogdrive_ego_feature_v1.gz，不检查或解压 qwen3_feature.gz；旧缓存须先补写 slim sidecar。
# ckpt 不可与 use_vlm=true 互移植（投影层集合不同，会被 initialize() 的 strict=False 静默丢弃），
#   须重训 IL 并重派生 RL reference；全链路（缓存/IL/RL/eval/可视化）须一致设 use_vlm。
use_vlm: true
first_hidden_state_index: 0
last_hidden_state_index: -1
# ego_status_dim: 8
# --- 自车状态编码器 / 状态丢弃编码器 SDE（默认 mlp，等价原流程，零影响）---
# mlp: 原始 Mlp，直接编码 13 维 status_feature。
# attention: SDE(参考 pluto)。训练时随机遮蔽运动学量(vx/vy/ax/ay/yaw_rate/curvature/
#   curvature_rate/steering_wheel_angle/steering_wheel_rate)，导航命令(cmd_0..cmd_3)永久可见，
#   逼模型少走"外推当前自车运动学"的捷径；eval 时不丢弃、用全量状态(故开集 L2 会变差，须看闭环 PDM)。
# 与 vlm_ablation 正交：none/zero 下均生效。切换 encoder 类型会改变权重结构，须重训 IL，且
# RL/eval 必须与 IL 用同一类型(否则 ckpt 加载时 attention 层被 initialize() 的 strict=False 丢成随机初始化)。
# status_feature 数值无需重算；尚无 slim sidecar 的旧缓存需先执行一次回填。
ego_status_encoder_type: mlp
ego_state_dropout: 0.75      # SDE 运动学量遮蔽概率(0~1)，仅 attention 生效
ego_num_command_states: 4    # status_feature 前 N 维为永久可见的导航命令(cmd_0..cmd_3)
# --- 障碍物 obj token（默认关闭，等价当前流程，零影响）---
# 开启后 agent.requires_scene=True：缓存 / eval 从 Scene 当前帧 GT annotations 取障碍物，
# 编码成 context token 拼到 vl_context_tokens 后进 DiT cross-attention。
# 开启需在全链路（缓存 / IL / RL / eval）一致设 use_object_vector=true，并重跑 hidden-state
# 缓存补出 object_vector_feature_v1.gz（CacheOnlyDataset 缺该 .gz 会报告缺失并过滤不完整样本）。
use_object_vector: false
max_obj_tokens: 64
obj_range_x: [-20.0, 100.0]
obj_range_y: [-40.0, 40.0]
include_static_objects: false
object_token_dropout: 0.1
# obj 编码器类型: mlp=单帧几何(ObjectEncoder); temporal=差分+时序FPN+静态MLP(TemporalObjectEncoder)。
# 切 temporal 需重跑 obj 缓存(get_unique_name -> object_temporal_feature_v1)，且全链路一致。
object_encoder_type: mlp
# 动/静划分阈值(m/s)：当前帧地速 < 阈值判为静态(纯几何约束)，>= 判为动态(几何+运动意图)。
static_speed_threshold: 0.5
grpo: False
# Step 3 (optional): tighten the behavior-cloning anchor. Defaults reproduce the
# Step 1+2 RL run. Override from the RL script, e.g.
#   agent.bc_coeff=0.3 agent.bc_teacher_deterministic=true
bc_coeff: 0.1
bc_teacher_deterministic: false
lr: 1e-4
use_hdmap_vector: false
max_map_tokens: 128
map_sample_points: 20
hdmap_radius: 120.0
strict_hdmap_vector: false
# 开启后 MapEncoder 额外编码左右车道边界几何（per-point 6->13 维），token 数不变、缓存无需重跑；
# 但新增 centerline_encoder 权重，须重训 IL（旧 ckpt 该层随机初始化），RL/eval 换用新 IL 产物。
use_lane_boundaries: false
# fp16 数值加固开关（默认关，字节级零影响）：对进 MapEncoder 的局部米制坐标做 nan_to_num+
# clamp(±1000)+scale，消除未归一化大坐标(实测<652m)在 fp16 训练下的激活/梯度放大。仅改
# planner 内 MapEncoder.forward、不改缓存；从头训练效果一致，但旧 ckpt 不可热启（首层输入
# 尺度变了）。多城市/长训数值稳健用，须与 use_hdmap_vector=true 搭配。
hdmap_input_norm: false
# --- 前视图像 ResNet encoder token（默认关闭，等价当前流程，零影响；仅实验用）---
# 目的：vlm_ablation=zero 屏蔽 VLM 语义 token 的同时，仍通过独立可训练 ResNet 向 DiT 注入
# 前视图像视觉信息。图像从 agent_input 当前帧 cam_f0 取，编成空间 token 拼到 vl_context_tokens
# 后进 DiT cross-attention（与 obj/hdmap token 并列）。与 vlm_ablation 正交（zero 下图像 token 保留）。
# 开启需在全链路（缓存/IL/RL/eval）一致设 use_image_encoder=true，并重跑 hidden-state 缓存补出
# front_image_feature_v1_cam_f0_{H}x{W}.gz（VLM 不重算；CacheOnlyDataset 缺该 .gz 会报告缺失并过滤不完整样本）。
# ckpt 不可移植：旧 IL ckpt 无 ResNet，加载进带 encoder 的 agent 时该层被 strict=False 丢成随机
# 初始化，故须重训 IL，RL/eval 用新 IL 产物。缓存 uint8 图像，磁盘按 token 数量级增长（见评估）。
use_image_encoder: false
image_encoder_arch: resnet34   # timm features_only 主干；无网络时自动退化到随机初始化
image_encoder_pretrained: true
image_height: 256              # 缓存 resize 目标高（H）
image_width: 704               # 缓存 resize 目标宽（W）
image_grid_h: 8                # ResNet 特征图自适应池化到的 token 网格高
image_grid_w: 16               # 网格宽；图像 token 数 = grid_h*grid_w（默认 128）
image_token_dropout: 0.0       # 训练期图像 token 随机丢弃概率（GRPO 时强制 eval 关闭）
image_view: cam_f0             # 取图相机字段名
