_target_: navsim.agents.recogdrive.recogdrive_agent.ReCogDriveAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5
checkpoint_path: ''
vlm_path: ''
cam_type: 'single'
# --- 多视角 / 多帧时序输入（默认全关，等价当前单视角单帧 Qwen3 流程，零影响）---
# 视角数 = len(view_list)；多视角 / 多帧需在脚本里显式 override 开启，并保证缓存与
# 训练 / eval 用相同配置（否则 get_unique_name 对不上、CacheOnlyDataset 静默丢样本）。
# mogo 多视角推荐用真实有数据的视角 ['cam_f0','cam_l0','cam_r0','cam_l1','cam_r1','cam_b0']，
# 避免选空的 cam_l2/cam_r2（否则 edge-pad 会用前视图冒充后侧视图）。
view_list: ['cam_f0']
num_frames: 1
use_video_input: false   # 仅 Qwen3 生效；True 且 num_frames>1 时走 videos= 视频路径
video_fps: 2.0
vlm_type: 'internvl'
dit_type: 'small'
sampling_method: 'ddim'
cache_mode: False
cache_hidden_state: True
metric_cache_path: ''
reference_policy_checkpoint: ''
vlm_size: 'small'
train_backbone: false
vl_hidden_dim: 1536
normalize_vl_hidden_states: false
first_hidden_state_index: 0
last_hidden_state_index: -1
grpo: False
# Step 3 (optional): tighten the behavior-cloning anchor. Defaults reproduce the
# Step 1+2 RL run. Override from the RL script, e.g.
#   agent.bc_coeff=0.3 agent.bc_teacher_deterministic=true
bc_coeff: 0.1
bc_teacher_deterministic: false
lr: 1e-4
