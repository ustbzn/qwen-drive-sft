_target_: navsim.agents.recogdrive.recogdrive_agent.ReCogDriveAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5
checkpoint_path: ''
vlm_path: ''
cam_type: 'single'
# --- 多视角 / 多帧时序输入（默认全关，等价当前单视角单帧 Qwen3 流程，零影响）---
# 视角数 = len(view_list)；多视角 / 多帧需在脚本里显式 override 开启，并保证缓存与
# 训练 / eval 用相同配置（否则 get_unique_name 对不上、CacheOnlyDataset 静默丢样本）。
# mogo 多视角推荐用真实有数据的视角 ['cam_f0','cam_l0','cam_r0','cam_l1','cam_r1','cam_b0']，
# 避免选空的 cam_l2/cam_r2（否则 edge-pad 会用前视图冒充后侧视图）。
view_list: ['cam_f0']
num_frames: 1
use_video_input: false   # 仅 Qwen3 生效；True 且 num_frames>1 时走 videos= 视频路径
video_fps: 2.0
vlm_type: 'internvl'
dit_type: 'small'
sampling_method: 'ddim'
cache_mode: False
cache_hidden_state: True
metric_cache_path: ''
reference_policy_checkpoint: ''
vlm_size: 'small'
train_backbone: false
vl_hidden_dim: 1536
normalize_vl_hidden_states: false
# VLM 消融开关：none=正常使用 VLM；zero=置零 VLM 的 summary/context token，
# 仅消融 VLM 分支，obj token / ego status / history & action 等非 VLM 输入完整保留。
# 依赖性测试：加载已训练 ckpt，仅 eval 时 override agent.vlm_ablation=zero。
# 公平能力测试：IL 与 GRPO 全程同设 agent.vlm_ablation=zero（缓存可复用，无需重生成）。
vlm_ablation: none
first_hidden_state_index: 0
last_hidden_state_index: -1
# ego_status_dim: 8
# --- 自车状态编码器 / 状态丢弃编码器 SDE（默认 mlp，等价原流程，零影响）---
# mlp: 原始 Mlp，直接编码 13 维 status_feature。
# attention: SDE(参考 pluto)。训练时随机遮蔽运动学量(vx/vy/ax/ay/yaw_rate/curvature/
#   curvature_rate/steering_wheel_angle/steering_wheel_rate)，导航命令(cmd_0..cmd_3)永久可见，
#   逼模型少走"外推当前自车运动学"的捷径；eval 时不丢弃、用全量状态(故开集 L2 会变差，须看闭环 PDM)。
# 与 vlm_ablation 正交：none/zero 下均生效。切换 encoder 类型会改变权重结构，须重训 IL，且
# RL/eval 必须与 IL 用同一类型(否则 ckpt 加载时 attention 层被 initialize() 的 strict=False 丢成随机初始化)。
# 缓存无需重跑：status_feature 已在缓存里，改动只在模型侧。
ego_status_encoder_type: mlp
ego_state_dropout: 0.75      # SDE 运动学量遮蔽概率(0~1)，仅 attention 生效
ego_num_command_states: 4    # status_feature 前 N 维为永久可见的导航命令(cmd_0..cmd_3)
# --- 障碍物 obj token（默认关闭，等价当前流程，零影响）---
# 开启后 agent.requires_scene=True：缓存 / eval 从 Scene 当前帧 GT annotations 取障碍物，
# 编码成 context token 拼到 vl_context_tokens 后进 DiT cross-attention。
# 开启需在全链路（缓存 / IL / RL / eval）一致设 use_object_vector=true，并重跑 hidden-state
# 缓存补出 object_vector_feature_v1.gz（CacheOnlyDataset 缺该 .gz 会静默丢样本）。
use_object_vector: false
max_obj_tokens: 64
obj_range_x: [-20.0, 100.0]
obj_range_y: [-40.0, 40.0]
include_static_objects: false
object_token_dropout: 0.1
# obj 编码器类型: mlp=单帧几何(ObjectEncoder); temporal=差分+时序FPN+静态MLP(TemporalObjectEncoder)。
# 切 temporal 需重跑 obj 缓存(get_unique_name -> object_temporal_feature_v1)，且全链路一致。
object_encoder_type: mlp
# 动/静划分阈值(m/s)：当前帧地速 < 阈值判为静态(纯几何约束)，>= 判为动态(几何+运动意图)。
static_speed_threshold: 0.5
grpo: False
# Step 3 (optional): tighten the behavior-cloning anchor. Defaults reproduce the
# Step 1+2 RL run. Override from the RL script, e.g.
#   agent.bc_coeff=0.3 agent.bc_teacher_deterministic=true
bc_coeff: 0.1
bc_teacher_deterministic: false
lr: 1e-4
use_hdmap_vector: false
max_map_tokens: 128
map_sample_points: 20
hdmap_radius: 120.0
strict_hdmap_vector: false
# 开启后 MapEncoder 额外编码左右车道边界几何（per-point 6->13 维），token 数不变、缓存无需重跑；
# 但新增 centerline_encoder 权重，须重训 IL（旧 ckpt 该层随机初始化），RL/eval 换用新 IL 产物。
use_lane_boundaries: false
