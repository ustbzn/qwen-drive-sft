# MOGO multi-batch/multi-city manifest for the current project (3 beijing batches + 1 shanghai).
# Keep raw dataset roots independent; merge only cache roots at training time.
# Select this manifest for the manifest runners via: export MOGO_MANIFEST=<this file>
# Add a new dataset by appending one entry under `datasets:` (see docs/mogo_multi_dataset_usage_plan.md).
#
# Field semantics:
#   name              globally-unique id (used by --name filter, eval experiment suffix, logging)
#   city              label only (merged-CSV grouping)
#   data_root         dataset root; must contain dataset/{maps,navsim_logs,sensor_blobs}
#   sqlite_path       this dataset's HD map sqlite; never reuse across cities
#   utm_zone          beijing=50, shanghai=51
#   utm_south         southern-hemisphere flag (false for China)
#   cache_path        feature cache root (training); points at the already-built cache
#   metric_cache_path metric cache root (PDM eval / RL reward)

# Merged-evaluation CSV output root (keeps merged results out of worldsim/).
merged_eval_root: /pcpt/pcpt/data/VLA/MOGO/recogdrive_dataset/traffic_light_multi/merged_eval
# Shared IL/RL output root. When MOGO_MANIFEST points here, the training shells default
# NAVSIM_EXP_ROOT to this (so checkpoints/logs land in one shared place, not a single batch).
train_exp_root: /pcpt/pcpt/data/VLA/MOGO/recogdrive_dataset/traffic_light_multi/exp

datasets:
